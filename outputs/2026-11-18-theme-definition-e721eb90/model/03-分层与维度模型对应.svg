<text x="70" y="674" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#17384c" font-weight="400">跨各加工步骤</text>
<text x="55" y="1043" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">同粒度ADS允许存在：公共汇总可复用 + 面向应用的语义补全和发布隔离；不强制每层降粒度。</text>
