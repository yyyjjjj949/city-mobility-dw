<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1110" viewBox="0 0 1580 1110" role="img" aria-label="分层职责与维度模型：两种设计视角的对应"><rect width="100%" height="100%" fill="#f5f8fa"/>
<text x="45" y="69" font-family="Microsoft YaHei,Arial,sans-serif" font-size="34" fill="#17384c" font-weight="700">分层职责与维度模型：两种设计视角的对应</text>
<text x="45" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#546d7d" font-weight="400">逻辑DIM与DWD共同组成明细维度模型；ODS/DWS/ADS描述加工与服务职责</text>
