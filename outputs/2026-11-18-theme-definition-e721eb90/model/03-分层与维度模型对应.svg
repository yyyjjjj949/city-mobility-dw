<text x="1020" y="428" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="700">DWD 两张事务事实</text>
<text x="1020" y="462" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">一有效出租车源行 / 一有效ride_id</text>
<text x="1020" y="496" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">事实 + 维度形成星型 / 共享星座</text>
<line x1="910" y1="465" x2="1000" y2="465" stroke="#7892a3" stroke-width="2"/>
