<text x="490" y="462" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">日期 / 分钟 / 区域 / 方式 / 天气</text>
<text x="490" y="496" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">站点 / 车型；角色键与未知成员</text>
