<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-label="城市历史出行：概念主题结构"><rect width="100%" height="100%" fill="#f5f8fa"/>
<text x="45" y="69" font-family="Microsoft YaHei,Arial,sans-serif" font-size="34" fill="#17384c" font-weight="700">城市历史出行：概念主题结构</text>
<text x="45" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#546d7d" font-weight="400">表达业务对象与分析视角；不在概念层混入表字段、主外键或数据库实体关系</text>
