<text x="900" y="404" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#17384c" font-weight="400">一次历史骑行的完成记录</text>
<line x1="350" y1="430" x2="270" y2="530" stroke="#7892a3" stroke-width="2"/>
<line x1="1150" y1="430" x2="270" y2="530" stroke="#7892a3" stroke-width="2"/>
<line x1="350" y1="430" x2="750" y2="530" stroke="#7892a3" stroke-width="2"/>
<line x1="1150" y1="430" x2="750" y2="530" stroke="#7892a3" stroke-width="2"/>
