<line x1="1150" y1="430" x2="1230" y2="530" stroke="#7892a3" stroke-width="2"/>
<rect x="50" y="530" width="430" height="145" rx="13" fill="#ffffff" stroke="#9cb3c2" stroke-width="2"/>
<text x="70" y="568" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="700">T01 出行需求与时间规律</text>
<text x="70" y="602" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">日期、小时、周类型、交通方式</text>
<text x="70" y="636" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">关注活动强度与日内差异</text>
<rect x="535" y="530" width="430" height="145" rx="13" fill="#ffffff" stroke="#9cb3c2" stroke-width="2"/>
<text x="555" y="568" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="700">T02 区域出发与OD联系</text>
<text x="555" y="602" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">起点/终点区域、行政区、时段</text>
<text x="555" y="636" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">关注热点、联系与匹配覆盖</text>
<rect x="1020" y="530" width="430" height="145" rx="13" fill="#ffffff" stroke="#9cb3c2" stroke-width="2"/>
<text x="1040" y="568" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="700">T03 天气与出行量对比</text>
<text x="1040" y="602" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">周类型、降水组、方式、样本日</text>
<text x="1040" y="636" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#17384c" font-weight="400">关注关联及证据适用范围</text>
<rect x="70" y="745" width="1360" height="110" rx="13" fill="#eaf0f3" stroke="#9cb3c2" stroke-width="2"/>
<text x="90" y="785" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#17384c" font-weight="700">共同分析保障：一致时间与空间定义 · 来源与质量追溯 · 样本和分母可核查</text>
<text x="90" y="821" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#17384c" font-weight="400">输出：业务问题 → 指标与分析维度 → 图表与数值证据 → 结论与边界</text>
<text x="70" y="922" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#6d5a38" font-weight="400">边界：接入行程≠全市总出行；观察关联≠因果；无边界来源不发布完整到达/净流入</text>
</svg>