<text x="120" y="369" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#17384c" font-weight="700">业务过程：出租车行程</text>
<text x="120" y="404" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#17384c" font-weight="400">一次历史行程的完成记录</text>
<rect x="880" y="330" width="520" height="100" rx="13" fill="#e8f0fa" stroke="#9cb3c2" stroke-width="2"/>
