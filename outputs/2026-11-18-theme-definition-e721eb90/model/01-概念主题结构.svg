<text x="490" y="226" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#17384c" font-weight="400">范围：2025年6月 · Yellow Taxi / Citi Bike</text>
<line x1="650" y1="255" x2="350" y2="330" stroke="#7892a3" stroke-width="2"/>
